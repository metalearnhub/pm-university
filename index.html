<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PM University</title>
<meta property="og:title" content="PM University" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="PM University" />
<link rel="stylesheet" href="/app/app.css?v=3">
<style>
#gate{display:none;min-height:100vh;align-items:center;justify-content:center;padding:16px;background:#f5f6f8;font-family:Inter,system-ui,sans-serif}
html.locked #gate{display:flex}
html.locked #pmu{display:none}
#gate form{background:#fff;border:1px solid #e3e6ea;border-radius:16px;padding:28px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#gate h1{font-size:20px;font-weight:800;color:#1a1f36}
#gate p{font-size:14px;color:#4A5672;line-height:1.5}
#gate input{border:1px solid #d6dae1;border-radius:10px;padding:12px 14px;font-size:18px;letter-spacing:4px;text-align:center;font-family:inherit}
#gate button{background:#1a1f36;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
#gate button[disabled]{opacity:.6}
#gate .err{color:#b42318;font-size:13px;min-height:18px}
</style>
<script>
/* Passcode gate. A correct passcode returns a device key from the Supabase function "pmu";
   the key powers cloud sync (the meta URLs app.js reads) and keeps this device unlocked. */
var PMU_FN="https://qbubwemdvwflxvxwesrl.supabase.co/functions/v1/pmu";
var PMU_KEY="";try{PMU_KEY=localStorage.getItem("pmu_key")||"";}catch(e){}
if(!PMU_KEY){document.documentElement.className+=" locked";}
else{
  ["data","rows"].forEach(function(op){var m=document.createElement("meta");m.name="sheet-"+op+"-url";m.content=PMU_FN+"?op="+op+"&k="+encodeURIComponent(PMU_KEY);document.head.appendChild(m);});
  fetch(PMU_FN+"?op=check&k="+encodeURIComponent(PMU_KEY)).then(function(r){if(r.status===401){try{localStorage.removeItem("pmu_key");}catch(e){}location.reload();}}).catch(function(){});
}
</script>
</head>
<body>
<div id="gate"><form id="gateForm" autocomplete="off">
<h1>PM University</h1>
<p>Enter your passcode. This device stays unlocked after that.</p>
<input id="gatePass" type="password" inputmode="numeric" placeholder="Passcode" aria-label="Passcode">
<div class="err" id="gateErr"></div>
<button type="submit" id="gateBtn">Unlock</button>
</form></div>
<div id="pmu"><p style="font-family:system-ui;padding:40px;text-align:center;color:#4A5672">Loading PM University…</p></div>
<script>
document.getElementById("gateForm").addEventListener("submit",function(e){e.preventDefault();
  var b=document.getElementById("gateBtn"),er=document.getElementById("gateErr"),v=document.getElementById("gatePass").value.trim();
  if(!v){er.textContent="Enter the passcode.";return;}
  b.disabled=true;er.textContent="";
  fetch(PMU_FN,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"unlock",passcode:v})})
  .then(function(r){return r.json().then(function(d){return{s:r.status,d:d};});})
  .then(function(x){if(x.d.key){try{localStorage.setItem("pmu_key",x.d.key);}catch(e){}location.reload();return;}
    b.disabled=false;er.textContent=x.s===429?"Too many tries. Wait an hour and try again.":"Wrong passcode.";})
  .catch(function(){b.disabled=false;er.textContent="Couldn't reach the server. Check your connection.";});
});
if(PMU_KEY){["/app/content.js?v=3","/app/ojt.js?v=3","/app/app.js?v=3"].forEach(function(src){var s=document.createElement("script");s.src=src;s.async=false;document.body.appendChild(s);});}
</script>
</body></html>
